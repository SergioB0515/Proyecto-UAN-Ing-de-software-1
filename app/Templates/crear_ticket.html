{% extends "base.html" %}

{% block title %}Crear ticket{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Reportar un problema</h2>
        <form method="POST" action="{{ url_for('tickets.crear') }}">
            <div class="mb-3">
                <label class="form-label">Describe el problema</label>
                <textarea name="texto" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar ticket</button>
        </form>
    </div>
</div>
{% endblock %}
