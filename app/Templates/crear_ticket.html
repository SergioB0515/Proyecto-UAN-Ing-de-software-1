{% extends "base.html" %}

{% block title %}Crear ticket{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-body p-4">
                <h2 class="mb-1">Reportar un problema</h2>
                <p class="text-muted mb-4">Describe la situación con el mayor detalle posible para agilizar la atención.</p>
                <form method="POST" action="{{ url_for('tickets.crear') }}">
                    <div class="mb-3">
                        <label class="form-label">Describe el problema</label>
                        <textarea name="texto" class="form-control" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Enviar ticket</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
